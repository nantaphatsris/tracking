<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIGHT SKY TRACKER · TV DISPLAY</title><style>
*{box-sizing:border-box}body{margin:0;background:#02030a;display:grid;place-items:center;min-height:100vh;color:white;font-family:system-ui}
.stage{width:min(96vw,160vh);aspect-ratio:16/9;position:relative;overflow:hidden;background:#080d25;border:2px solid #9aa9ff;box-shadow:0 0 40px #28316b}
.art{position:absolute;left:6.875%;top:12.222%;width:86.25%;height:75.556%;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#25245c,#080d25 60%,#030611)}
.art svg{width:100%;height:100%}.borderlabel{position:absolute;color:#aebaff;font:12px system-ui;letter-spacing:.15em;opacity:.7}
.marker{position:absolute;width:5.5%;height:auto;background:white;padding:3px;aspect-ratio:1;display:grid;place-items:center}
.marker canvas{width:100%;height:100%}
#tl{left:.75%;top:1.3%}#tr{right:.75%;top:1.3%}#bl{left:.75%;bottom:1.3%}#br{right:.75%;bottom:1.3%}
.lab{position:absolute;left:50%;transform:translateX(-50%);bottom:2%;font-size:10px;letter-spacing:.22em;color:#a8b6ff}
</style></head><body>
<div class="stage" id="stage">
 <div class="art">
  <svg viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid slice">
   <defs><radialGradient id="neb"><stop stop-color="#6964b9" stop-opacity=".45"/><stop offset="1" stop-color="#171c50" stop-opacity="0"/></radialGradient></defs>
   <rect width="1200" height="650" fill="#080d25"/><ellipse cx="600" cy="330" rx="550" ry="300" fill="url(#neb)"/>
   <g stroke="#879bff" stroke-opacity=".35" stroke-width="2" fill="none"><path d="M80 430L210 270 390 340 510 150 690 260 850 110 1030 300 1120 180"/><path d="M210 270L270 510 500 470 690 260 760 500 1030 300"/></g>
   <g fill="#fff"><circle cx="80" cy="430" r="5"/><circle cx="210" cy="270" r="8"/><circle cx="390" cy="340" r="4"/><circle cx="510" cy="150" r="7"/><circle cx="690" cy="260" r="6"/><circle cx="850" cy="110" r="8"/><circle cx="1030" cy="300" r="5"/><circle cx="1120" cy="180" r="4"/><circle cx="270" cy="510" r="4"/><circle cx="500" cy="470" r="7"/><circle cx="760" cy="500" r="5"/></g>
   <g fill="#c8d4ff" opacity=".75"><circle cx="130" cy="90" r="2"/><circle cx="320" cy="110" r="2"/><circle cx="430" cy="570" r="2"/><circle cx="600" cy="80" r="2"/><circle cx="930" cy="560" r="2"/><circle cx="1090" cy="470" r="2"/><circle cx="740" cy="360" r="2"/><circle cx="100" cy="580" r="2"/></g>
  </svg>
 </div>
 <div class="marker" id="tl"><canvas></canvas></div><div class="marker" id="tr"><canvas></canvas></div>
 <div class="marker" id="bl"><canvas></canvas></div><div class="marker" id="br"><canvas></canvas></div>
 <div class="lab">NIGHT SKY TRACKER · TRACKING BORDER · 32-INCH TV PROFILE</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
const ids=['NST_TL','NST_TR','NST_BL','NST_BR'];
ids.forEach((id,i)=>{const c=document.querySelectorAll('.marker canvas')[i];QRCode.toCanvas(c,id,{width:180,margin:0,errorCorrectionLevel:'H'},e=>{if(e)console.error(e)})});
</script></body></html>
